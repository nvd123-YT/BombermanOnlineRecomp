name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no game data committed
        run: |
          echo "Checking for copyrighted game data outside the vendored engine..."
          if git ls-files | grep -v '^dreamcomp/' | grep -iE '\.(chd|cue|gdi|cdi|iso|bin|PVR|AFS|DAT|vmu|vms|vmi|gzf|gpr|rep)$'; then
            echo "::error::Game data files found in the public repository."
            exit 1
          fi
          echo "OK: no game data committed."

  build-and-package:
    if: ${{ !contains(github.event.head_commit.message || '', '[recovery-publish-107]') }}
    name: Build and package prebuilt game
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Require private asset token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.BOMBERMAN_PRIVATE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Add the BOMBERMAN_PRIVATE_TOKEN Actions secret (fine-grained token with Contents: Read-only access to nvd123-YT/bombermanprivate)."
            exit 1
          fi

      - name: Checkout private game assets
        uses: actions/checkout@v4
        with:
          repository: nvd123-YT/bombermanprivate
          ref: main
          token: ${{ secrets.BOMBERMAN_PRIVATE_TOKEN }}
          path: private-assets
          persist-credentials: false

      - name: Verify and stage boot executable
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path("private-assets/1ST_READ.BIN")
          if not source.is_file():
              raise SystemExit("Private assets repository is missing 1ST_READ.BIN")
          digest = hashlib.sha1(source.read_bytes()).hexdigest()
          expected = "26fb8164ab585714bf384eadcfe97734d212240d"
          if digest != expected:
              raise SystemExit(f"Wrong Bomberman Online boot revision: {digest}; expected {expected}")
          target = Path("game/extracted/fs/1ST_READ.BIN")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source.read_bytes())
          print(f"Verified private boot executable ({source.stat().st_size} bytes, SHA-1 {digest})")
          PY

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev libpipewire-0.3-dev

      - name: Ensure Ninja is available
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi

      - name: Build static SDL3
        shell: bash
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_DISABLE_INSTALL=OFF
          cmake --build "$RUNNER_TEMP/SDL-build" --config Release --parallel 2
          cmake --install "$RUNNER_TEMP/SDL-build" --config Release
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sdl3" >> "$GITHUB_ENV"

      - name: Configure native game with Vulkan renderer
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDREAMCOMP_DIR=dreamcomp \
            -DDREAM_RENDERER=ON \
            -DDREAMCOMP_FRONTEND=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" 2>&1 | tee configure.log
          if ! grep -q "Vulkan backend enabled" configure.log; then
            echo "::error::Vulkan renderer was not configured; refusing to package a headless build."
            exit 1
          fi

      - name: Compile the actual Bomberman Online game
        shell: bash
        run: |
          cmake --build build --target bomberman_online_boot --parallel 2
          if [ "$RUNNER_OS" = "Windows" ]; then
            GAME_EXE="build/game/bomberman-online.exe"
          else
            GAME_EXE="build/game/bomberman-online"
          fi
          test -s "$GAME_EXE" || { echo "::error::Native game executable was not produced."; exit 1; }
          test -d build/game/frontend || { echo "::error::Game frontend assets were not produced."; exit 1; }
          echo "Prebuilt executable ready: $GAME_EXE"
          ls -lah build/game

      - name: Stage Windows Vulkan loader when present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Vulkan SDK supplies headers, import libraries and shader tools.
          # The runtime loader is normally installed by the user's graphics driver
          # into Windows\System32; the SDK archive is not guaranteed to include it.
          $loader = Join-Path $env:SystemRoot "System32\vulkan-1.dll"
          if (Test-Path $loader) {
            Copy-Item $loader "build/game/vulkan-1.dll" -Force
            Write-Host "Bundled the runner's Vulkan loader: $loader"
          } else {
            Write-Host "No Vulkan loader on this runner; Windows graphics drivers provide vulkan-1.dll on target systems. Continuing package build."
          }

      - name: Bundle Vulkan runtime for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          GAME_DIR="build/game"
          GAME_EXE="$GAME_DIR/bomberman-online"
          test -s "$GAME_EXE"
          # Vulkan's loader is linked as @rpath/libvulkan.1.dylib on macOS.
          # That is a Mach-O install name, not a filesystem path; resolve it inside
          # the SDK before copying it beside the executable.
          while IFS= read -r dependency; do
            case "$dependency" in
              *libvulkan*.dylib)
                name="$(basename "$dependency")"
                if [ -f "$dependency" ]; then
                  loader_source="$dependency"
                else
                  loader_source="$(find "$VULKAN_SDK" -name "$name" -print -quit)"
                fi
                if [ -z "$loader_source" ] || [ ! -f "$loader_source" ]; then
                  echo "::error::Could not resolve $dependency inside VULKAN_SDK=$VULKAN_SDK"
                  find "$VULKAN_SDK" -iname '*vulkan*.dylib' -print || true
                  exit 1
                fi
                cp -L "$loader_source" "$GAME_DIR/$name"
                install_name_tool -change "$dependency" "@executable_path/$name" "$GAME_EXE"
                ;;
            esac
          done < <(otool -L "$GAME_EXE" | awk 'NR > 1 {print $1}')
          MOLTEN_LIB="$(find "$VULKAN_SDK" -name libMoltenVK.dylib -print -quit)"
          ICD_SOURCE="$(find "$VULKAN_SDK" -name MoltenVK_icd.json -print -quit)"
          test -n "$MOLTEN_LIB" && test -f "$MOLTEN_LIB"
          test -n "$ICD_SOURCE" && test -f "$ICD_SOURCE"
          cp -L "$MOLTEN_LIB" "$GAME_DIR/libMoltenVK.dylib"
          install_name_tool -add_rpath @executable_path "$GAME_EXE" 2>/dev/null || true
          python - "$ICD_SOURCE" "$GAME_DIR/MoltenVK_icd.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          data["ICD"]["library_path"] = "./libMoltenVK.dylib"
          Path(sys.argv[2]).write_text(json.dumps(data, indent=2) + "\n")
          PY
          echo "Bundled Vulkan loader and MoltenVK ICD for the macOS release."
          otool -L "$GAME_EXE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/launcher/package-lock.json

      - name: Install launcher dependencies
        working-directory: tools/launcher
        run: npm ci

      - name: Embed release build identity
        working-directory: tools/launcher
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            CHANNEL="stable"
          elif [[ "$GITHUB_WORKFLOW" == *Nightly* ]]; then
            TAG="nightly-$GITHUB_RUN_ID"
            CHANNEL="nightly"
          else
            TAG="prebuilt-$GITHUB_RUN_ID"
            CHANNEL="prebuilt"
          fi
          python - "$TAG" "$GITHUB_SHA" "$CHANNEL" <<'PY'
          import json, sys
          from pathlib import Path
          Path("build-info.json").write_text(json.dumps({
              "tag": sys.argv[1],
              "commit": sys.argv[2],
              "channel": sys.argv[3]
          }, indent=2) + "\n")
          PY

      - name: Run launcher UI selftest
        working-directory: tools/launcher
        env:
          CI: "true"
          ELECTRON_DISABLE_GPU: "1"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
            xvfb-run -a npm run selftest -- --disable-gpu --no-sandbox
          else
            npm run selftest -- --disable-gpu --no-sandbox
          fi

      - name: Package prebuilt game for this platform
        working-directory: tools/launcher
        run: npm run package

      - name: Upload prebuilt game package
        uses: actions/upload-artifact@v4
        with:
          name: bomberman-online-prebuilt-${{ matrix.os }}
          path: tools/launcher/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish prebuilt GitHub release
    needs: [validate, build-and-package]
    runs-on: ubuntu-latest
    # Main-branch builds also publish a pre-release so successful platform
    # packages are attached to a downloadable GitHub Release, not left only
    # as short-lived Actions artifacts. Version tags publish normal releases.
    if: ${{ !contains(github.event.head_commit.message || '', '[recovery-publish-107]') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download and verify platform packages from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          import zipfile

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api = f"https://api.github.com/repos/{repo}"
          output = pathlib.Path("release-assets")
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"]) / "platform-artifacts"
          output.mkdir(parents=True, exist_ok=True)
          temporary.mkdir(parents=True, exist_ok=True)

          def open_api(url):
              request = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(request, timeout=180)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, message, response_headers, newurl):
                  return None

          github_opener = urllib.request.build_opener(NoRedirect)

          def open_artifact_download(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  return github_opener.open(request, timeout=180)
              except urllib.error.HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      raise
                  signed_url = response.headers.get("Location")
                  response.close()
                  if not signed_url:
                      raise RuntimeError("GitHub artifact response omitted signed download URL")
                  # The signed storage URL authenticates itself. Do not forward
                  # the GitHub bearer token to Azure artifact storage.
                  return urllib.request.urlopen(
                      urllib.request.Request(signed_url),
                      timeout=180,
                  )

          with open_api(f"{api}/actions/runs/{run_id}/artifacts?per_page=100") as response:
              index = json.loads(response.read())

          required = {
              "bomberman-online-prebuilt-windows-latest",
              "bomberman-online-prebuilt-macos-latest",
              "bomberman-online-prebuilt-ubuntu-latest",
          }
          artifacts = [item for item in index.get("artifacts", []) if item.get("name") in required]
          available = {item["name"] for item in artifacts if not item.get("expired", True)}
          if available != required:
              raise SystemExit(f"Expected three unexpired platform artifacts; found {sorted(available)}")

          for artifact in artifacts:
              name = artifact["name"]
              archive = temporary / f"{name}.zip"
              expected_digest = artifact.get("digest") or ""
              download_url = artifact["archive_download_url"]
              success = False

              for attempt in range(1, 6):
                  try:
                      print(f"Downloading {name} (attempt {attempt}/5)")
                      digest = hashlib.sha256()
                      with open_artifact_download(download_url) as response, archive.open("wb") as target:
                          while True:
                              chunk = response.read(8 * 1024 * 1024)
                              if not chunk:
                                  break
                              target.write(chunk)
                              digest.update(chunk)

                      actual_digest = "sha256:" + digest.hexdigest()
                      if expected_digest and actual_digest != expected_digest:
                          raise ValueError(f"SHA-256 mismatch: expected {expected_digest}, got {actual_digest}")

                      with zipfile.ZipFile(archive) as bundle:
                          bad_member = bundle.testzip()
                          if bad_member:
                              raise ValueError(f"Corrupt ZIP member: {bad_member}")
                          root = output.resolve()
                          for member in bundle.infolist():
                              destination = (output / member.filename).resolve()
                              if not destination.is_relative_to(root):
                                  raise ValueError(f"Unsafe ZIP path: {member.filename}")
                          bundle.extractall(output)

                      success = True
                      print(f"Verified {name}: {archive.stat().st_size} bytes")
                      break
                  except Exception as error:
                      archive.unlink(missing_ok=True)
                      print(f"::warning::Attempt {attempt} failed for {name}: {error}")
                      if attempt < 5:
                          time.sleep(attempt * 5)

              if not success:
                  raise SystemExit(f"Could not download and verify {name} after five attempts")

          extensions = (".dmg", ".exe", ".AppImage", ".deb", ".tar.gz", ".zip")
          packages = [
              item for item in output.iterdir()
              if item.is_file() and item.name.endswith(extensions)
          ]
          if len(packages) < 7:
              raise SystemExit(f"Expected at least seven platform packages, found {len(packages)}")
          print("Verified platform packages:")
          for item in sorted(packages):
              print(f"  {item.name}: {item.stat().st_size} bytes")
          PY

      - name: Generate SHA-256 package manifest
        shell: bash
        run: |
          cd release-assets
          python - <<'PY'
          from pathlib import Path
          import hashlib
          suffixes = (".dmg", ".exe", ".AppImage", ".deb", ".tar.gz", ".zip")
          lines = []
          for item in sorted(Path(".").iterdir()):
              if item.is_file() and item.name.endswith(suffixes):
                  digest = hashlib.sha256(item.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {item.name}")
          if not lines:
              raise SystemExit("No platform packages were downloaded.")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          # Main pushes get a uniquely tagged pre-release; v* tags retain
          # their normal versioned release behavior.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('prebuilt-{0}', github.run_id) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Prebuilt build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
