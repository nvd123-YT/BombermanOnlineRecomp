name: Recover prebuilt release #107

on:
  push:
    branches: [recovery/release-107]

permissions:
  actions: read
  contents: write

jobs:
  recover-and-publish:
    name: Recover existing platform packages and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the three #107 platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: "43092142505"
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request
          import urllib.error
          import zipfile

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api = f"https://api.github.com/repos/{repo}"
          output = pathlib.Path("release-assets")
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"]) / "bomberman-recovery"
          output.mkdir(parents=True, exist_ok=True)
          temporary.mkdir(parents=True, exist_ok=True)

          def open_url(url):
              request = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(request, timeout=180)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, message, response_headers, newurl):
                  return None

          github_opener = urllib.request.build_opener(NoRedirect)

          def open_artifact_download(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  return github_opener.open(request, timeout=180)
              except urllib.error.HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      raise
                  signed_url = response.headers.get("Location")
                  if not signed_url:
                      raise RuntimeError("GitHub artifact response had no signed download URL")
                  response.close()
                  # The signed Azure URL authenticates itself. Never forward the
                  # GitHub bearer token to the artifact-storage host.
                  return urllib.request.urlopen(
                      urllib.request.Request(signed_url),
                      timeout=180,
                  )

          index_url = f"{api}/actions/runs/{run_id}/artifacts?per_page=100"
          with open_url(index_url) as response:
              index = json.loads(response.read())

          required = {
              "bomberman-online-prebuilt-windows-latest",
              "bomberman-online-prebuilt-macos-latest",
              "bomberman-online-prebuilt-ubuntu-latest",
          }
          artifacts = [item for item in index.get("artifacts", []) if item.get("name") in required]
          available = {item["name"] for item in artifacts if not item.get("expired", True)}
          if available != required:
              raise SystemExit(f"Expected 3 unexpired artifacts; found {sorted(available)}")

          for artifact in artifacts:
              name = artifact["name"]
              archive = temporary / f"{name}.zip"
              expected_digest = artifact.get("digest") or ""
              download_url = artifact["archive_download_url"]
              success = False

              for attempt in range(1, 6):
                  try:
                      print(f"Downloading {name} (attempt {attempt}/5)")
                      digest = hashlib.sha256()
                      with open_artifact_download(download_url) as response, archive.open("wb") as target:
                          while True:
                              chunk = response.read(8 * 1024 * 1024)
                              if not chunk:
                                  break
                              target.write(chunk)
                              digest.update(chunk)

                      actual_digest = "sha256:" + digest.hexdigest()
                      if expected_digest and actual_digest != expected_digest:
                          raise ValueError(f"Digest mismatch: expected {expected_digest}, got {actual_digest}")

                      with zipfile.ZipFile(archive) as bundle:
                          bad_member = bundle.testzip()
                          if bad_member:
                              raise ValueError(f"Corrupt ZIP member: {bad_member}")
                          root = output.resolve()
                          for member in bundle.infolist():
                              target = (output / member.filename).resolve()
                              if not target.is_relative_to(root):
                                  raise ValueError(f"Unsafe archive path: {member.filename}")
                          bundle.extractall(output)

                      success = True
                      print(f"Verified {name}: {archive.stat().st_size} bytes")
                      break
                  except Exception as error:
                      archive.unlink(missing_ok=True)
                      print(f"::warning::Attempt {attempt} failed for {name}: {error}")
                      if attempt < 5:
                          time.sleep(attempt * 5)

              if not success:
                  raise SystemExit(f"Failed to download and validate {name}")

          extensions = (".dmg", ".exe", ".AppImage", ".deb", ".tar.gz", ".zip")
          packages = [item for item in output.iterdir() if item.is_file() and item.name.endswith(extensions)]
          if len(packages) < 7:
              raise SystemExit(f"Expected at least 7 platform package files, found {len(packages)}")
          for item in sorted(packages):
              print(f"Recovered {item.name}: {item.stat().st_size} bytes")
          PY

      - name: Generate SHA-256 package manifest
        shell: bash
        run: |
          cd release-assets
          python - <<'PY'
          from pathlib import Path
          import hashlib
          suffixes = (".dmg", ".exe", ".AppImage", ".deb", ".tar.gz", ".zip")
          lines = []
          for item in sorted(Path(".").iterdir()):
              if item.is_file() and item.name.endswith(suffixes):
                  digest = hashlib.sha256(item.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {item.name}")
          if not lines:
              raise SystemExit("No release packages were recovered.")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish recovered prebuilt release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-recovered-43092142505
          name: Prebuilt build 107 (recovered)
          target_commitish: main
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
