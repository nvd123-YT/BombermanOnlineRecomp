name: Nightly Prebuilt Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no game data committed
        run: |
          echo "Checking for copyrighted game data outside the vendored engine..."
          if git ls-files | grep -v '^dreamcomp/' | grep -iE '\.(chd|cue|gdi|cdi|iso|bin|PVR|AFS|DAT|vmu|vms|vmi|gzf|gpr|rep)$'; then
            echo "::error::Game data files found in the public repository."
            exit 1
          fi
          echo "OK: no game data committed."

  build-and-package:
    name: Build and package prebuilt game
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Require private asset token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.BOMBERMAN_PRIVATE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Add the BOMBERMAN_PRIVATE_TOKEN Actions secret (fine-grained token with Contents: Read-only access to nvd123-YT/bombermanprivate)."
            exit 1
          fi

      - name: Checkout private game assets
        uses: actions/checkout@v4
        with:
          repository: nvd123-YT/bombermanprivate
          ref: main
          token: ${{ secrets.BOMBERMAN_PRIVATE_TOKEN }}
          path: private-assets
          persist-credentials: false

      - name: Verify and stage boot executable
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path("private-assets/1ST_READ.BIN")
          if not source.is_file():
              raise SystemExit("Private assets repository is missing 1ST_READ.BIN")
          digest = hashlib.sha1(source.read_bytes()).hexdigest()
          expected = "26fb8164ab585714bf384eadcfe97734d212240d"
          if digest != expected:
              raise SystemExit(f"Wrong Bomberman Online boot revision: {digest}; expected {expected}")
          target = Path("game/extracted/fs/1ST_READ.BIN")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source.read_bytes())
          print(f"Verified private boot executable ({source.stat().st_size} bytes, SHA-1 {digest})")
          PY

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev libpipewire-0.3-dev

      - name: Ensure Ninja is available
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi

      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build static SDL3
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
                        -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_DISABLE_INSTALL=OFF
          cmake --build "$RUNNER_TEMP/SDL-build" --config Release --parallel 2
          cmake --install "$RUNNER_TEMP/SDL-build" --config Release
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sdl3" >> "$GITHUB_ENV"

      - name: Configure native game with Vulkan renderer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
                        -DDREAMCOMP_DIR=dreamcomp \
            -DDREAM_RENDERER=ON \
            -DDREAMCOMP_FRONTEND=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" 2>&1 | tee configure.log
          if ! grep -q "Vulkan backend enabled" configure.log; then
            echo "::error::Vulkan renderer was not configured; refusing to package a headless build."
            exit 1
          fi

      - name: Compile the actual Bomberman Online game
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --target bomberman_online_boot --parallel 2
          if [ "$RUNNER_OS" = "Windows" ]; then
            GAME_EXE="build/game/bomberman-online.exe"
          else
            GAME_EXE="build/game/bomberman-online"
          fi
          test -s "$GAME_EXE" || { echo "::error::Native game executable was not produced."; exit 1; }
          test -d build/game/frontend || { echo "::error::Game frontend assets were not produced."; exit 1; }
          echo "Prebuilt executable ready: $GAME_EXE"
          ls -lah build/game

      - name: Build and verify Windows game with clang-cl and static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Use the Windows toolchain documented by dreamcomp: clang-cl, Ninja,
          # and the Visual Studio x64 linker. Do not build with runner MinGW g++.
          $clang = Get-Command clang-cl.exe -ErrorAction Stop
          $linker = Get-Command link.exe -ErrorAction Stop
          Get-Command dumpbin.exe -ErrorAction Stop | Out-Null
          Write-Host "clang-cl: $($clang.Source)"
          Write-Host "MSVC linker: $($linker.Source)"

          $sdlSource = Join-Path $env:RUNNER_TEMP "SDL"
          $sdlBuild = Join-Path $env:RUNNER_TEMP "SDL-build"
          $sdlPrefix = Join-Path $env:RUNNER_TEMP "sdl3"
          & git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git $sdlSource
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch SDL3 source." }

          # SDL and the game must use the same compiler and static CRT.
          $sdlConfigureArgs = @(
            "-S", $sdlSource, "-B", $sdlBuild, "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW",
            "-DCMAKE_INSTALL_PREFIX=$sdlPrefix",
            "-DSDL_SHARED=OFF", "-DSDL_STATIC=ON",
            "-DSDL_TEST_LIBRARY=OFF", "-DSDL_TESTS=OFF", "-DSDL_EXAMPLES=OFF",
            "-DSDL_DISABLE_INSTALL=OFF"
          )
          & cmake @sdlConfigureArgs
          if ($LASTEXITCODE -ne 0) { throw "SDL3 configuration failed with clang-cl." }

          & cmake --build $sdlBuild --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "SDL3 static build failed." }

          & cmake --install $sdlBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw "SDL3 installation failed." }

          # /MT applies to the complete build graph, including vendored engine
          # libraries. The resulting executable must not import MinGW or VCRuntime.
          $gameConfigureArgs = @(
            "-S", ".", "-B", "build", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
            "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW",
            "-DDREAMCOMP_DIR=dreamcomp",
            "-DDREAM_RENDERER=ON",
            "-DDREAMCOMP_FRONTEND=ON",
            "-DCMAKE_PREFIX_PATH=$sdlPrefix"
          )
          $configureOutput = & cmake @gameConfigureArgs 2>&1
          $configureExitCode = $LASTEXITCODE
          $configureOutput | Tee-Object -FilePath configure-windows.log
          if ($configureExitCode -ne 0) { throw "Bomberman CMake configuration failed." }
          if (($configureOutput -join [Environment]::NewLine) -notmatch "Vulkan backend enabled") {
            throw "Vulkan renderer was not configured; refusing to package a headless Windows build."
          }

          & cmake --build build --target bomberman_online_boot --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Bomberman Online failed to compile with clang-cl." }

          $gameDir = (Resolve-Path "build/game").Path
          $gameExe = Join-Path $gameDir "bomberman-online.exe"
          if (-not (Test-Path -LiteralPath $gameExe -PathType Leaf)) {
            throw "Native Windows executable was not produced: $gameExe"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $gameDir "frontend") -PathType Container)) {
            throw "Game frontend assets were not produced."
          }

          # Bundle the x64 Vulkan loader; all other non-system imports must be absent.
          $sdkLoader = Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"
          $systemLoader = Join-Path $env:SystemRoot "System32\vulkan-1.dll"
          if (Test-Path -LiteralPath $sdkLoader -PathType Leaf) {
            $loader = $sdkLoader
          } elseif (Test-Path -LiteralPath $systemLoader -PathType Leaf) {
            $loader = $systemLoader
          } else {
            throw "No x64 vulkan-1.dll was found in the Vulkan SDK or Windows System32."
          }
          Copy-Item -LiteralPath $loader -Destination (Join-Path $gameDir "vulkan-1.dll") -Force
          Write-Host "Bundled Vulkan loader from $loader"

          # Inspect the actual PE import table so a MinGW build or dynamic MSVC
          # CRT cannot silently slip into a release again.
          $imports = & dumpbin.exe /nologo /dependents $gameExe 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin could not inspect the Windows executable." }
          $importText = $imports -join [Environment]::NewLine
          Write-Host $importText
          if ($importText -match "(?i)libgcc|libstdc\+\+|libwinpthread|libatomic|libgomp") {
            throw "Windows executable still imports a GNU/MinGW runtime; refusing to package it."
          }
          if ($importText -match "(?i)\bVCRUNTIME\d+(?:_\d+)?\.dll|\bMSVCP\d+\.dll") {
            throw "Windows executable still imports the dynamic MSVC runtime; expected the static /MT runtime."
          }

          # Test with no compiler or user-installed runtime directories on PATH.
          # Windows still resolves DLLs shipped beside the executable.
          $oldPath = $env:PATH
          try {
            $env:PATH = "$gameDir;$env:SystemRoot\System32;$env:SystemRoot"
            & $gameExe --help
            $gameExitCode = $LASTEXITCODE
          } finally {
            $env:PATH = $oldPath
          }
          if ($gameExitCode -ne 0) {
            throw "Windows native executable failed its clean-PATH startup test (exit $gameExitCode)."
          }
          Write-Host "Windows clang-cl executable passed import-table and clean-PATH startup checks."

      - name: Bundle Vulkan runtime for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          GAME_DIR="build/game"
          GAME_EXE="$GAME_DIR/bomberman-online"
          test -s "$GAME_EXE"
          # Vulkan's loader is linked as @rpath/libvulkan.1.dylib on macOS.
          # That is a Mach-O install name, not a filesystem path; resolve it inside
          # the SDK before copying it beside the executable.
          while IFS= read -r dependency; do
            case "$dependency" in
              *libvulkan*.dylib)
                name="$(basename "$dependency")"
                if [ -f "$dependency" ]; then
                  loader_source="$dependency"
                else
                  loader_source="$(find "$VULKAN_SDK" -name "$name" -print -quit)"
                fi
                if [ -z "$loader_source" ] || [ ! -f "$loader_source" ]; then
                  echo "::error::Could not resolve $dependency inside VULKAN_SDK=$VULKAN_SDK"
                  find "$VULKAN_SDK" -iname '*vulkan*.dylib' -print || true
                  exit 1
                fi
                cp -L "$loader_source" "$GAME_DIR/$name"
                install_name_tool -change "$dependency" "@executable_path/$name" "$GAME_EXE"
                ;;
            esac
          done < <(otool -L "$GAME_EXE" | awk 'NR > 1 {print $1}')
          MOLTEN_LIB="$(find "$VULKAN_SDK" -name libMoltenVK.dylib -print -quit)"
          ICD_SOURCE="$(find "$VULKAN_SDK" -name MoltenVK_icd.json -print -quit)"
          test -n "$MOLTEN_LIB" && test -f "$MOLTEN_LIB"
          test -n "$ICD_SOURCE" && test -f "$ICD_SOURCE"
          cp -L "$MOLTEN_LIB" "$GAME_DIR/libMoltenVK.dylib"
          install_name_tool -add_rpath @executable_path "$GAME_EXE" 2>/dev/null || true
          python - "$ICD_SOURCE" "$GAME_DIR/MoltenVK_icd.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          data["ICD"]["library_path"] = "./libMoltenVK.dylib"
          Path(sys.argv[2]).write_text(json.dumps(data, indent=2) + "\n")
          PY
          echo "Bundled Vulkan loader and MoltenVK ICD for the macOS release."
          otool -L "$GAME_EXE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/launcher/package-lock.json

      - name: Install launcher dependencies
        working-directory: tools/launcher
        run: npm ci

      - name: Embed release build identity
        working-directory: tools/launcher
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            CHANNEL="stable"
          elif [[ "$GITHUB_WORKFLOW" == *Nightly* ]]; then
            TAG="nightly-$GITHUB_RUN_ID"
            CHANNEL="nightly"
          else
            TAG="prebuilt-$GITHUB_RUN_ID"
            CHANNEL="prebuilt"
          fi
          python - "$TAG" "$GITHUB_SHA" "$CHANNEL" <<'PY'
          import json, sys
          from pathlib import Path
          Path("build-info.json").write_text(json.dumps({
              "tag": sys.argv[1],
              "commit": sys.argv[2],
              "channel": sys.argv[3]
          }, indent=2) + "\n")
          PY

      - name: Run launcher UI selftest
        working-directory: tools/launcher
        env:
          CI: "true"
          ELECTRON_DISABLE_GPU: "1"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
            xvfb-run -a npm run selftest -- --disable-gpu --no-sandbox
          else
            npm run selftest -- --disable-gpu --no-sandbox
          fi

      - name: Package prebuilt game for this platform
        working-directory: tools/launcher
        run: npm run package

      - name: Upload prebuilt game package
        uses: actions/upload-artifact@v4
        with:
          name: bomberman-online-prebuilt-${{ matrix.os }}
          path: tools/launcher/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish nightly prebuilt release
    needs: [validate, build-and-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download prebuilt packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate SHA-256 package manifest
        shell: bash
        run: |
          cd release-assets
          python - <<'PY'
          from pathlib import Path
          import hashlib
          suffixes = (".dmg", ".exe", ".AppImage", ".deb", ".tar.gz", ".zip")
          lines = []
          for item in sorted(Path(".").iterdir()):
              if item.is_file() and item.name.endswith(suffixes):
                  digest = hashlib.sha256(item.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {item.name}")
          if not lines:
              raise SystemExit("No platform packages were downloaded.")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create nightly tag
        id: tag
        shell: bash
        run: |
          TAG="nightly-${{ github.run_id }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Nightly ${{ steps.tag.outputs.tag }}
          body: |
            ## Nightly Prebuilt Build

            Automated native game and launcher packages built from `main`.

            **A Bomberman Online disc image (.chd) is still required at runtime** for the game's GD-ROM reads. The downloaded app already contains the compiled native executable; no local compilation is required.
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
