# Bomberman Online (USA), MK-51065 V1.004 (20011004) -- dreamcomp game config.
# Format: dreamcomp/engine/docs/game-config.md. Measured on the owner's GD-ROM CHD; never commit
# disc data. The boot file is stored plain on a retail GD-ROM (no MIL-CD descrambling needed):
# SHA-256 5e01678b... is the CHD, SHA-1 below is the plain 1ST_READ.BIN.

[game]
id = "bomberman_online"
title = "Bomberman Online"
region = "USA"
product = "MK-51065"
symbols = "symbols.tsv"

[disc]
sha1_1st_read = "26fb8164ab585714bf384eadcfe97734d212240d"

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by tools/dc.py setup, git-ignored
load_address = 0x8C010000            # where the BIOS loads the boot file
link_address = 0x0C010000            # what the literal pools assume (P0 alias of same RAM)
entry = 0x8C010000                   # first instruction (a nop-padded Katana loader stub)

# Discovery seeds reported by runs (suggested.toml). These are call targets the
# translator did not find; they sit inside the image, not in a copied region.
# 0x0C1EA932/3C/A04/A16 were first reached in the windowed run once the expansion-device
# probes returned "device absent" (0xFFFFFFFF), which changed the modem/BBA control flow.
[functions]
extra = [0x0C0F85AE,  # called 498 times in the first run
         0x0C0F85C2,  # called 582 times
         0x0C0F85CE,  # called 1076 times
         0x0C0A40EE,  # called 1 time; the last untranslated target after the relocations
         0x0C1EA932,  # called 1 time; reached once modem probe returns 0xFFFFFFFF
         0x0C1EA93C,  # called 1 time
         0x0C1EAA04,  # called 1 time
         0x0C1EAA16,  # called 1 time
         # Leaf functions reached only through function-pointer tables. The sweep pass only
         # recognises stack-frame prologues (sts.l pr / mov.l rN,@-r15), so these routines --
         # which start with a pc-relative literal load or an add to r15 -- stayed undiscovered
         # even though they are ordinary rts-terminated functions. Each address below was
         # confirmed by disassembly.
         0x0C1FE1A0, 0x0C1FE414, 0x0C1FE4B6, 0x0C1FE4CE, 0x0C1FE4EC, 0x0C1FE50A,
         0x0C1FE580, 0x0C1FE6A0, 0x0C1FE76E, 0x0C1FE7E0, 0x0C1FE7FE, 0x0C1FE81C,
         0x0C1FE85A, 0x0C1FE8B2, 0x0C1FE8D2, 0x0C1FE958, 0x0C1FE976, 0x0C1FE9E0,
         0x0C1FF190,
         # Whole code block sitting in a gap between known functions; full callee-save prologues.
         0x0C21AE60, 0x0C21B160, 0x0C21B440, 0x0C21B6E0,
         # Recovered leaf functions and four-byte rts stubs in the 0x24/0x25 region.
         0x0C23E05A, 0x0C2448E4, 0x0C2448FA, 0x0C244900, 0x0C244916, 0x0C244922,
         0x0C244C9E, 0x0C24AE1E, 0x0C24AE22, 0x0C24AE26, 0x0C24AE2A,
         0x0C24AF32, 0x0C24AF36, 0x0C24AF3A, 0x0C24AF3E, 0x0C24AF42, 0x0C24AF46,
         0x0C24AF4A, 0x0C24AF4E, 0x0C24AF52, 0x0C24AF56, 0x0C24AF5A,
         0x0C24DB8A, 0x0C24EF6E, 0x0C24F30C, 0x0C24FD1C, 0x0C24FEC6,
         0x0C250112, 0x0C2515BA, 0x0C251614, 0x0C251654, 0x0C251658, 0x0C25165C,
         0x0C251660, 0x0C251CC4, 0x0C251CCC, 0x0C255914, 0x0C266B6C]

# Regions the program copied out of the image and ran elsewhere (first 600-frame run). The
# 0x8C000000/0x8C000100/0x8C000400/0x8C000600 group is the exception/interrupt entry area; the
# 0x8C00F3FC region is the Katana system-variable / handler block. Each was matched byte-for-byte
# against the image by the runtime, so the source offsets are measured, not guessed.
[[relocations]]  # RAM 0x8C000000 reproduces image 0x0C22E970 for 52 bytes
source = 0x0C22E970
size = 0x34
dest = 0x8C000000

[[relocations]]  # RAM 0x8C000100 reproduces image 0x0C22E8DC for 52 bytes
source = 0x0C22E8DC
size = 0x34
dest = 0x8C000100

[[relocations]]  # RAM 0x8C000400 reproduces image 0x0C22E8DC for 52 bytes
source = 0x0C22E8DC
size = 0x34
dest = 0x8C000400

[[relocations]]  # RAM 0x8C000600 reproduces image 0x0C22E914 for 88 bytes
source = 0x0C22E914
size = 0x58
dest = 0x8C000600

[[relocations]]  # RAM 0x8C00F3FC reproduces image 0x0C1BE6A4 for 716 bytes
source = 0x0C1BE6A4
size = 0x2CC
dest = 0x8C00F3FC

